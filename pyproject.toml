[project]
name = "janus"
version = "0.1.0"
description = "Project Janus - an adversarial red-team/blue-team AI lab for payment fraud: identify, generate, defend."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Rohit Anand" }]
keywords = ["fraud-detection", "payments", "upi", "red-team", "adversarial-ml", "synthetic-data"]

dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "shap>=0.46",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "huggingface-hub>=0.25",
    "matplotlib>=3.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
llm = ["httpx>=0.27"]
docs = ["python-docx>=1.1"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
janus = "janus.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["janus"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end runs that take minutes"]
