id: VY-SOC-004
name: Long-con romance investment with LLM persona
summary: >-
  A synthetic romantic persona maintained by an LLM across weeks of daily conversation
  gradually introduces a fraudulent trading platform, showing fabricated gains before
  soliciting escalating deposits that cannot be withdrawn.
rails: [upi_p2p, imps, neft, cross_border]
genai_enablers: [persona_synthesis, llm_dialogue, deepfake_video, localisation]
surfaces: [social_media, chat_app, web, voice_call]
monetization: [push_payment, crypto_offramp, mule_transfer]
kill_chain:
  - phase: recon
    description: Profile emotionally isolated targets with disposable savings from dating and social platforms.
    genai_used: true
  - phase: resource_dev
    description: Generate a consistent synthetic identity with photo set, backstory and voice, maintained by an LLM with persistent memory.
    genai_used: true
  - phase: trust_build
    description: Sustain weeks of individualised daily conversation across hundreds of concurrent victims.
    genai_used: true
  - phase: pretext
    description: Introduce a controlled investment platform showing fabricated portfolio growth.
    genai_used: true
  - phase: instrument
    description: Victim makes escalating deposits, often liquidating fixed deposits or taking loans.
    genai_used: false
  - phase: launder
    description: Deposits are aggregated through layered mule accounts and off-ramped to crypto.
    genai_used: false
observables:
  - sustained_escalating_payments_to_same_counterparty
  - savings_product_liquidation_precedes_transfer
  - counterparty_receives_from_many_unrelated_payers
  - payment_reference_investment_keywords
  - new_loan_drawdown_then_immediate_transfer
  - transfer_pattern_persists_over_weeks
mitigations:
  - Cumulative-exposure alerting across a rolling window per counterparty
  - Intervention prompts when savings liquidation is followed by outbound transfer
  - Shared industry counterparty risk lists
victim_profile:
  age_bands: ["40-65"]
  segment: retail
  notes: Disproportionately affects recently widowed or divorced individuals.
status: established
severity: 5
scalability: 4
detectability: 4
simulated: true
injector: soc_romance_investment
references:
  - "FTC consumer sentinel reporting on romance and investment scam losses"
