id: VY-SOC-010
name: Cloned-voice vishing against contact-centre agents
summary: >-
  Rather than targeting customers, the attacker clones a customer's voice to defeat the
  bank contact centre's own voice biometrics and knowledge-based authentication, then
  requests a beneficiary addition or contact-detail change.
rails: [imps, neft, upi_p2p]
genai_enablers: [voice_clone, llm_dialogue]
surfaces: [voice_call, ivr]
monetization: [push_payment, mule_transfer]
kill_chain:
  - phase: recon
    description: Acquire breached KBA data and a voice sample of the target customer.
    genai_used: false
  - phase: resource_dev
    description: Clone the customer's voice with sufficient fidelity to pass passive voice biometrics.
    genai_used: true
  - phase: credential_access
    description: Pass agent authentication and change the registered mobile number or email.
    genai_used: true
  - phase: instrument
    description: Add a beneficiary and transfer once the notification channel is under attacker control.
    genai_used: false
observables:
  - contact_detail_change_precedes_beneficiary_add
  - beneficiary_add_then_immediate_high_value_transfer
  - channel_switch_before_payment
  - notification_channel_recently_modified
mitigations:
  - Mandatory cooling-off after contact-detail change before beneficiary addition
  - Liveness and replay-attack detection on voice biometrics
  - Notify the old channel on any contact-detail change
status: emerging
severity: 4
scalability: 3
detectability: 4
simulated: false
