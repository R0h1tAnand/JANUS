id: VY-SOC-003
name: LLM-personalised smishing to card-not-present cashout
summary: >-
  An LLM ingests a breached marketing list and generates per-recipient SMS referencing the
  victim's actual bank, city and a recent plausible transaction, driving them to a cloned
  payment page that harvests card details and OTP in real time.
rails: [card_cnp]
genai_enablers: [llm_content, localisation, code_gen, persona_synthesis]
surfaces: [sms, web]
monetization: [cnp_purchase, goods_resale, gift_card]
kill_chain:
  - phase: recon
    description: Correlate breach dumps to derive bank, city and language per victim.
    genai_used: false
  - phase: resource_dev
    description: Generate thousands of unique, grammatically native SMS variants and a pixel-accurate cloned checkout page.
    genai_used: true
  - phase: pretext
    description: Send the personalised alert claiming a suspicious transaction requiring immediate verification.
    genai_used: true
  - phase: credential_access
    description: Harvest PAN, CVV and relay the OTP through a live operator console.
    genai_used: false
  - phase: evasion
    description: Rotate sending IDs and page domains faster than blocklists propagate; no two messages share a template hash.
    genai_used: true
  - phase: monetize
    description: Immediate high-value purchases at low-friction digital merchants, resold for cash.
    genai_used: false
observables:
  - cnp_at_never_seen_merchant
  - otp_entered_within_seconds_of_sms
  - device_fingerprint_unseen_for_card
  - rapid_successive_auth_attempts
  - shipping_billing_mismatch
  - digital_goods_high_value_first_purchase
mitigations:
  - Sender-ID allowlisting and URL rewriting at the telco layer
  - Step-up on unseen device plus unseen merchant combination
  - Delayed fulfilment on first high-value digital-goods purchase
victim_profile:
  age_bands: ["25-45"]
  digital_tenure: high
  segment: retail
status: established
severity: 3
scalability: 5
detectability: 3
simulated: true
injector: soc_smishing_cnp
references:
  - "Anti-Phishing Working Group trend reports on generative phishing content"
