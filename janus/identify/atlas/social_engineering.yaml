id: VY-SOC-009
name: AI-generated fake merchant storefront
summary: >-
  A complete e-commerce brand - product photography, reviews, policy pages, support chat -
  is generated end to end, accepts card and UPI payments for goods that never ship, and
  dissolves before chargeback volume triggers acquirer action.
