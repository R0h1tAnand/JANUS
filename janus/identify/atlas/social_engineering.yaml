id: VY-SOC-005
name: Fake bank support callback via spoofed IVR
summary: >-
  Victim searches for a bank helpline, reaches an SEO-poisoned fraudulent number, and is
  handled by an AI voice agent that reproduces the bank's real IVR tree before escalating
  to a "fraud desk" that walks them into authorising a transfer to a "safe account".
rails: [upi_p2p, imps, neft]
genai_enablers: [voice_clone, llm_dialogue, agentic_automation]
surfaces: [voice_call, ivr, web]
monetization: [push_payment, mule_transfer]
kill_chain:
  - phase: resource_dev
    description: Clone the bank's IVR prompts and deploy an autonomous voice agent able to handle inbound volume.
    genai_used: true
  - phase: recon
    description: Poison search results and map listings for the bank's support number.
    genai_used: false
  - phase: trust_build
    description: Reproduce the authentic IVR experience, then have the agent recite partial real account details obtained from a breach.
    genai_used: true
  - phase: pretext
    description: Claim the account is compromised and funds must be moved to a bank-controlled safe account.
    genai_used: true
  - phase: instrument
    description: Victim transfers the full balance to the attacker-controlled account.
    genai_used: false
observables:
  - full_balance_sweep
  - first_time_beneficiary
  - inbound_call_precedes_payment
  - payment_reference_safe_account_keywords
  - beneficiary_fan_in_from_unrelated_payers
mitigations:
  - Verified helpline listings and in-app-only support entry points
  - Balance-sweep detection with mandatory step-up
  - Customer education embedded at the transfer confirmation screen
victim_profile:
  age_bands: ["45-70"]
  digital_tenure: low
status: emerging
severity: 4
scalability: 4
detectability: 3
simulated: false
references:
  - "Indian Cyber Crime Coordination Centre advisories on fake helpline fraud"
