id: VY-SOC-007
name: Screen-share assisted transaction hijack
summary: >-
  Under a support or KYC pretext delivered by an AI voice agent, the victim installs a
  remote-access app; the attacker observes credentials and OTPs and drives the payment from
  the victim's own device, defeating device-binding and behavioural biometrics.
rails: [upi_p2p, imps, card_cnp]
genai_enablers: [voice_clone, llm_dialogue]
surfaces: [voice_call, screen_share, mobile_app]
monetization: [push_payment, cnp_purchase, mule_transfer]
kill_chain:
  - phase: pretext
    description: AI voice agent claims a pending KYC expiry or refund requiring assistance.
    genai_used: true
  - phase: trust_build
    description: Guide the victim through installing a legitimate remote-access application.
    genai_used: true
  - phase: credential_access
    description: Observe PIN entry and OTP delivery directly on the victim's screen.
    genai_used: false
  - phase: instrument
    description: Initiate transfers from the victim's genuine, bound device.
    genai_used: false
observables:
  - remote_access_app_concurrent_with_session
  - interaction_timing_atypical_for_user
  - accessibility_service_active_during_payment
  - first_time_beneficiary
  - full_balance_sweep
mitigations:
  - Block payment flows while screen-sharing or accessibility services are active
  - Behavioural-biometric divergence checks on input cadence
victim_profile:
  age_bands: ["35-70"]
  digital_tenure: low
status: established
severity: 4
scalability: 3
detectability: 2
simulated: false
