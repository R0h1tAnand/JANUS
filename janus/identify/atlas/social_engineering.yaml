genai_enablers: [llm_content, code_gen, persona_synthesis, agentic_automation]
surfaces: [web, social_media, marketplace, merchant_chatbot]
monetization: [goods_resale, push_payment, cnp_purchase]
kill_chain:
  - phase: resource_dev
    description: Generate storefront, catalogue imagery, review corpus and support chatbot in hours.
    genai_used: true
  - phase: recon
    description: Buy targeted social ads against high-intent shopping audiences.
    genai_used: false
  - phase: instrument
    description: Collect payments for undeliverable goods.
    genai_used: false
  - phase: evasion
    description: AI support chatbot stalls disputes past the chargeback window with plausible shipping updates.
    genai_used: true
  - phase: monetize
    description: Settle and dissolve the merchant entity before the dispute ratio surfaces.
    genai_used: false
observables:
