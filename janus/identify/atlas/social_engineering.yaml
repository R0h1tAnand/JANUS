# Authorised Push Payment (APP) and social-engineering vectors.
# The defining property of this family: the victim authenticates and authorises the payment
# themselves, so every device, credential and behavioural-biometric signal looks legitimate.
# GenAI attacks this family hardest because the bottleneck was always human persuasion at scale.
---
id: VY-SOC-001
name: Cloned-voice relative distress call
summary: >-
  Attacker scrapes 20-30 seconds of a family member's voice from Instagram reels or a WhatsApp
  status, clones it with an off-the-shelf TTS model, and calls an older relative claiming an
  accident, arrest or medical emergency requiring an immediate UPI transfer to a "hospital
  clerk" or "police contact" account.
rails: [upi_p2p, imps]
genai_enablers: [voice_clone, llm_dialogue, localisation]
surfaces: [voice_call, chat_app]
monetization: [push_payment, mule_transfer]
kill_chain:
  - phase: recon
    description: Harvest target family graph and voice samples from public social media.
    genai_used: false
  - phase: resource_dev
    description: Fine-tune or few-shot a voice clone from the harvested sample; script the pretext in the victim's regional language.
    genai_used: true
  - phase: pretext
    description: Place the call during a high-stress window (late evening, exam season) claiming an emergency.
    genai_used: true
  - phase: trust_build
    description: Sustain a live conversation using an LLM to answer family-specific probing questions.
    genai_used: true
  - phase: instrument
    description: Victim initiates one or more UPI transfers to a first-time beneficiary under time pressure.
    genai_used: false
  - phase: launder
    description: Mule fans the funds out within minutes across several downstream accounts.
    genai_used: false
observables:
  - first_time_beneficiary
  - inbound_call_precedes_payment
  - amount_escalation_within_session
  - out_of_pattern_hour
  - beneficiary_fan_in_from_unrelated_payers
  - payment_velocity_spike_vs_personal_baseline
mitigations:
  - Cooling-off window on first payment to a new beneficiary above a value threshold
  - In-app scam interstitial triggered by concurrent call activity
  - Confirmation-of-payee name matching before debit
victim_profile:
  age_bands: ["55-70", "70+"]
  digital_tenure: low
  segment: retail
  notes: Selection favours victims with recent large inbound credits (pension, maturity payouts).
status: emerging
severity: 4
scalability: 5
detectability: 4
simulated: true
injector: soc_voice_clone_distress
references:
  - "FBI IC3 PSA on AI voice cloning in family-emergency scams"
  - "RBI/NPCI advisories on UPI social-engineering fraud"
---
id: VY-SOC-002
name: Deepfake video CFO payment instruction
summary: >-
  A finance executive joins what appears to be a routine internal video call. Other
  participants are real-time deepfakes of the CFO and a colleague, who instruct an urgent
  vendor payment for a confidential acquisition, bypassing the normal approval chain.
rails: [neft, rtgs, cross_border]
genai_enablers: [deepfake_video, voice_clone, llm_dialogue]
surfaces: [voice_call, email, web]
monetization: [push_payment, mule_transfer, crypto_offramp]
kill_chain:
  - phase: recon
    description: Map the finance org chart, approval thresholds and current M&A rumours from LinkedIn and filings.
    genai_used: false
  - phase: resource_dev
    description: Build real-time face and voice models of the CFO from earnings-call and conference footage.
    genai_used: true
  - phase: pretext
    description: Schedule a plausible calendar invite referencing a confidential transaction.
    genai_used: true
  - phase: trust_build
    description: Run a live multi-party deepfake call so the victim sees familiar faces corroborating each other.
    genai_used: true
  - phase: instrument
    description: Victim raises a high-value beneficiary payment outside standard dual authorisation.
    genai_used: false
  - phase: monetize
    description: Funds land in a newly registered corporate account and are converted or moved cross-border same day.
    genai_used: false
observables:
  - new_corporate_beneficiary
  - payment_exceeds_role_historical_maximum
  - approval_chain_shortcut
  - beneficiary_account_age_days_low
  - cross_border_first_use
  - urgency_keywords_in_payment_reference
mitigations:
  - Out-of-band callback to a directory-held number for payments above threshold
  - Enforced dual authorisation that cannot be waived by seniority
  - Beneficiary account-age and name-match checks at initiation
victim_profile:
  segment: corporate
  notes: Mid-market treasury teams with fewer than five finance staff and no formal callback policy.
status: emerging
severity: 5
scalability: 2
detectability: 5
simulated: true
injector: soc_deepfake_cfo_bec
references:
  - "Reported 2024 Hong Kong multi-participant deepfake video BEC loss (~USD 25M)"
